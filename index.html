<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Dev Environment</title>
 <link rel="shortcut icon" href="https://raw.githubusercontent.com/thecodermehedi/store/refs/heads/main/favicon.ico"
  type="image/x-icon">
 <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
 <style>
  body,
  html {
   margin: 0;
   padding: 0;
   min-height: 100vh;
   font-family: 'Roboto', sans-serif;
   user-select: none;
   /* Prevent text selection */
  }

  body {
   display: flex;
   align-items: center;
   justify-content: center;
   background: linear-gradient(to bottom right, #111827, #1f2937);
   color: white;
  }

  main {
   text-align: center;
   padding: 2rem;
  }

  h1 {
   font-size: 2.25rem;
   font-weight: 700;
   margin-bottom: 1rem;
   background: linear-gradient(to right, #4ade80, #3b82f6);
   -webkit-background-clip: text;
   background-clip: text;
   color: transparent;
  }

  p {
   font-size: 1.25rem;
   margin-bottom: 2rem;
   color: #d1d5db;
  }

  .status {
   display: inline-block;
   padding: 0.75rem 1.5rem;
   font-size: 0.875rem;
   font-weight: 600;
   background-color: #22c55e;
   color: white;
   border-radius: 9999px;
   transition: transform 0.3s ease;
  }

  @media (min-width: 640px) {
   h1 {
    font-size: 3rem;
   }

   p {
    font-size: 1.5rem;
   }
  }

  @media (min-width: 768px) {
   h1 {
    font-size: 3.75rem;
   }

   p {
    font-size: 1.875rem;
   }
  }
 </style>
</head>

<body>
 <main>
  <h1>Development Environment</h1>
  <p id="subdomain"></p>
  <div class="status">Active</div>
 </main>
 <script>
  document.addEventListener('DOMContentLoaded', function () {
   const subdomainElement = document.getElementById('subdomain');
   let hostname = window.location.hostname;

   // Remove 'http://', 'https://', and 'www.' if present
   hostname = hostname.replace(/^(https?:\/\/)?(www\.)?/, '');

   subdomainElement.textContent = hostname;

   // Update the page title
   document.title = `Dev Environment - ${hostname}`;
  });
 </script>
</body>

</html>
